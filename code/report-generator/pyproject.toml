[tool.poetry]
name = "api-scanner-reporter"
version = "0.1.0"
description = "APIScanner Reporter"
authors = ["Cyber Security & Privacy Foundation"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
mysql-connector-python = "^26.10.0"
python-docx = "^1.2.0"
defusedxml = "^0.7.1"
pydantic = "^2.14.2"
openapi-spec-validator = "^0.9.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
